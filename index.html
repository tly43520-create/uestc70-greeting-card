<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1422">
<meta name="author" content="王志诚">
<title>芯艺 · 电子科技大学70周年贺卡</title>
<meta name="description" content="庆祝电子科技大学建校70周年的电子贺卡：橙色珠光封套、银杏挂饰、会通电发光的版画内卡，可填写姓名、学院与班级生成专属祝福。">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 霞鹜文楷（非阻塞加载；加载失败时自动回退到系统楷体） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css" media="print" onload="this.media='all'">
<style>
:root{
  --us:.5px; --uc:.6px;                 /* 由脚本按屏幕尺寸计算：封套/内卡每个设计单位对应的像素 */
  --orange:#EB4B1E; --orange-hi:#F8683A; --orange-lo:#D23A12;
  --orange-back:#DA441A; --orange-back-lo:#BF340E;
  --paper:#F4F3EF;
  --ink-blue:#1F8ED3; --ink-brown:#6B392B;
  --ui:#F6E7D6; --ui-dim:rgba(246,231,214,.66);
  --gx:50; --gy:50; --warm:.55;
  --kai:"LXGW WenKai Screen","KaiTi","STKaiti","Kaiti SC","楷体",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1320}
body{color:var(--ui);font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}

/* ---------- 背景 ---------- */
#bg{position:fixed;inset:0;background:radial-gradient(1100px 760px at 50% 44%,#1b2f4c 0%,#102038 46%,#0a1424 78%,#070d18 100%)}
#bg::before{content:"";position:absolute;left:50%;top:46%;width:130vmin;height:130vmin;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,128,64,.22),rgba(255,128,64,.07) 55%,transparent 74%);
  opacity:var(--warm);transition:opacity 1.8s ease}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgfx{z-index:1}
#fxFront{z-index:20}

/* ---------- 舞台 ---------- */
#scene{position:fixed;inset:0;z-index:10;pointer-events:none;transform-origin:50% 50%;opacity:0;transition:opacity .9s ease}
#scene.ready{opacity:1}
.layer{position:absolute;left:0;top:0;width:calc(var(--us)*730);height:calc(var(--us)*1040);
  transform-origin:calc(var(--us)*365) calc(var(--us)*520);pointer-events:none}
.layer>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#sleeveBack{z-index:1}
#sleeveFront{z-index:3}
.panel{position:absolute;pointer-events:auto;touch-action:none;cursor:grab}
.panel:active{cursor:grabbing}

/* 封套后片（整张） */
.back-panel{left:calc(var(--us)*32);top:calc(var(--us)*20);width:calc(var(--us)*672);height:calc(var(--us)*1000);border-radius:calc(var(--us)*3);
  background-color:var(--orange-back);
  background-image:var(--noise-pearl,none),
    linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,222,196,.16) 48%,rgba(255,255,255,0) 60%),
    linear-gradient(170deg,#E6521F,var(--orange-back) 50%,var(--orange-back-lo));
  background-size:160px 160px,300% 300%,100% 100%;
  background-position:0 0,calc(var(--gx)*1%) 50%,0 0;
  box-shadow:0 calc(var(--us)*34) calc(var(--us)*70) rgba(0,0,0,.5),0 calc(var(--us)*6) calc(var(--us)*14) rgba(0,0,0,.35)}
/* 封套前片（波浪口 + 花形镂空，形状由脚本生成的 SVG 蒙版决定） */
.front-panel{left:calc(var(--us)*20);top:calc(var(--us)*20);width:calc(var(--us)*690);height:calc(var(--us)*1000);
  -webkit-mask:var(--front-mask) 0 0/100% 100% no-repeat;mask:var(--front-mask) 0 0/100% 100% no-repeat;
  background-color:var(--orange);
  background-image:var(--noise-pearl,none),
    linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,230,205,.24) 47%,rgba(255,255,255,0) 61%),
    linear-gradient(172deg,var(--orange-hi) 0%,var(--orange) 40%,var(--orange-lo) 100%);
  background-size:160px 160px,300% 300%,100% 100%;
  background-position:0 0,calc(var(--gx)*1%) 50%,0 0}

/* 银杏挂饰：以挂环为轴摆动 */
.charm{position:absolute;left:calc(var(--us)*358);top:calc(var(--us)*494);width:calc(var(--us)*260);height:calc(var(--us)*220);
  transform-origin:calc(var(--us)*130) calc(var(--us)*20);pointer-events:none}
.charm svg{width:100%;height:100%;overflow:visible}
.charm .hit{pointer-events:all;cursor:pointer;touch-action:none}
.charm .glint{animation:glint 5.5s ease-in-out 1.2s infinite}
@keyframes glint{0%,52%{transform:translateX(0)}100%{transform:translateX(380px)}}

/* ---------- 内卡 ---------- */
#card{position:absolute;left:0;top:0;width:calc(var(--uc)*560);height:calc(var(--uc)*956);z-index:2;
  transform-origin:50% 50%;perspective:calc(var(--uc)*2600);pointer-events:auto;touch-action:none;cursor:grab;outline:none}
#card.out{z-index:6;cursor:pointer}
#card:focus-visible{outline:2px solid rgba(255,214,170,.8);outline-offset:8px}
.cshadow{position:absolute;left:calc(var(--uc)*-90);top:calc(var(--uc)*-90);width:calc(var(--uc)*740);height:calc(var(--uc)*1136);
  pointer-events:none;transform-origin:calc(var(--uc)*370) calc(var(--uc)*568)}
.cshadow svg{width:100%;height:100%}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{clip-path:polygon(22.9% 0,100% 0,100% 100%,0 100%,0 13.4%)}
.face.back{clip-path:polygon(0 0,77.1% 0,100% 13.4%,100% 100%,0 100%);transform:rotateY(180deg)}
.paper{position:absolute;inset:0;background-color:var(--paper);
  background-image:var(--noise-fine,none),
    radial-gradient(120% 90% at 28% 16%,rgba(255,255,255,.6),rgba(255,255,255,0) 62%),
    radial-gradient(140% 120% at 82% 112%,rgba(110,100,130,.12),rgba(0,0,0,0) 62%);
  background-size:170px 170px,100% 100%,100% 100%}
.paper::after{content:"";position:absolute;inset:0;mix-blend-mode:multiply;opacity:.6;
  background:linear-gradient(125deg,#fff 0%,#ffe8f0 16%,#fff3dc 30%,#e8fff2 43%,#e4f0ff 56%,#f6e6ff 68%,#fff 82%);
  background-size:260% 260%;background-position:calc(var(--gx)*1%) calc(var(--gy)*1%)}
.gloss{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.7) 46%,rgba(255,255,255,0) 61%),
    linear-gradient(to bottom,rgba(255,255,255,.12),rgba(0,0,0,.07));
  background-size:300% 300%,100% 100%;background-position:calc(var(--gx)*1%) calc(var(--gy)*1%),0 0}
.edge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* 版画油墨：用照片中提取出的真实版画作为蒙版 */
.ink{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.m-blue{-webkit-mask-image:var(--mask-blue);mask-image:var(--mask-blue)}
.m-brown{-webkit-mask-image:var(--mask-brown);mask-image:var(--mask-brown)}
.ink.blue{background:var(--ink-blue)}
.ink.brown{background:var(--ink-brown)}
/* 通电特效：光晕 / 能量波 / 人像流光 / 电子 / 指示灯 */
.halo{position:absolute;inset:0;filter:blur(calc(var(--uc)*6));opacity:0;transition:opacity 1.4s ease}
.halo .ink{background:#27b6ff}
#card.powered .halo{opacity:.5}
.wave{overflow:hidden}
.wave i{position:absolute;left:62%;top:42%;width:calc(var(--uc)*60);height:calc(var(--uc)*60);margin:calc(var(--uc)*-30) 0 0 calc(var(--uc)*-30);
  border-radius:50%;opacity:0;transform:scale(.2);
  background:radial-gradient(circle,rgba(255,255,255,0) 50%,rgba(240,253,255,1) 62%,rgba(130,228,255,.85) 67%,rgba(40,170,255,0) 75%)}
#card.powering .wave i:nth-child(1){animation:wave 2.4s cubic-bezier(.25,.6,.3,1) forwards}
#card.powered .wave i:nth-child(2){animation:wave 3.6s cubic-bezier(.35,.5,.4,1) 2.6s infinite}
@keyframes wave{0%{transform:scale(.2);opacity:0}6%{opacity:1}78%{opacity:.9}100%{transform:scale(48);opacity:0}}
.sheen{overflow:hidden}
.sheen i{position:absolute;top:-10%;bottom:-10%;left:-60%;width:46%;transform:skewX(-14deg);
  background:linear-gradient(100deg,rgba(255,222,172,0) 0%,rgba(255,232,190,.62) 50%,rgba(255,222,172,0) 100%)}
#card.powered .sheen i{animation:sheen 8s ease-in-out .6s infinite}
@keyframes sheen{0%{transform:translateX(0) skewX(-14deg)}32%,100%{transform:translateX(460%) skewX(-14deg)}}
.electrons{position:absolute;inset:0;pointer-events:none}
.electrons b{position:absolute;left:0;top:0;width:calc(var(--uc)*10);height:calc(var(--uc)*10);margin:calc(var(--uc)*-5) 0 0 calc(var(--uc)*-5);
  border-radius:50%;opacity:0;background:radial-gradient(circle,#fff 0 30%,#c4f4ff 44%,rgba(64,196,255,0) 72%);
  box-shadow:0 0 calc(var(--uc)*10) calc(var(--uc)*3) rgba(40,180,255,.6)}
.electrons b::after{content:"";position:absolute;right:50%;top:50%;width:calc(var(--uc)*54);height:calc(var(--uc)*3.6);
  margin-top:calc(var(--uc)*-1.8);border-radius:99px;background:linear-gradient(90deg,rgba(60,190,255,0),rgba(170,238,255,.9))}
.led{position:absolute;left:87.5%;top:2.85%;width:calc(var(--uc)*40);height:calc(var(--uc)*40);margin:calc(var(--uc)*-20) 0 0 calc(var(--uc)*-20);
  border-radius:50%;opacity:0;transform:scale(.5);transition:opacity .5s,transform .5s;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0 16%,rgba(140,232,255,.85) 28%,rgba(40,170,255,0) 70%)}
#card.powered .led{opacity:.75;transform:scale(1)}
.led.blink{animation:blink .6s ease-out}
@keyframes blink{0%{transform:scale(1.9);opacity:1}100%{transform:scale(1);opacity:.75}}
.logo{position:absolute;left:calc(73.25% - var(--uc)*67.8);top:calc(83.58% - var(--uc)*67.8);width:calc(var(--uc)*135.6);height:calc(var(--uc)*135.6)}
.logo .cn{font-family:"PingFang SC","Microsoft YaHei","Heiti SC","Noto Sans SC",sans-serif}
.logo .en{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif}

/* ---------- 内卡背面：祝福语 ---------- */
.back-deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.letter{--fs:1;position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--uc)*158) calc(var(--uc)*54) calc(var(--uc)*56);color:#2b2522;font-family:var(--kai)}
.msg-to{font-size:calc(var(--uc)*31*var(--fs));letter-spacing:.04em;margin-bottom:calc(var(--uc)*14*var(--fs));min-height:1.3em}
.msg-to::after{content:"："}
.msg-intro,.msg-main{white-space:pre-wrap;word-break:break-word}
.msg-body{--lh:calc(var(--uc)*52*var(--fs));font-size:calc(var(--uc)*27*var(--fs));line-height:var(--lh);min-height:calc(var(--lh)*8);
  white-space:normal;word-break:break-word;letter-spacing:.03em;
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - var(--uc)*2),rgba(31,142,211,.24) calc(var(--lh) - var(--uc)*2),rgba(31,142,211,.24) var(--lh));
  background-size:100% var(--lh)}
.sign{margin-top:auto;padding:calc(var(--uc)*34) calc(var(--uc)*70) 0 0;text-align:right}
.msg-from{font-size:calc(var(--uc)*25);letter-spacing:.06em;min-height:1.3em}
.msg-date{margin-top:calc(var(--uc)*6);font-size:calc(var(--uc)*20);color:#6d5f55;letter-spacing:.12em;min-height:1.3em}
.seal{position:absolute;right:calc(var(--uc)*44);bottom:calc(var(--uc)*50);width:calc(var(--uc)*54);height:calc(var(--uc)*100);
  transform:rotate(-3deg);mix-blend-mode:multiply;opacity:.92}
.seal text{font-family:var(--kai);font-weight:700}
/* 逐字“洇墨”显现 */
.to-hide .msg-to,.to-hide .sign,.to-hide .seal{opacity:0}
.revealing .msg-to{animation:fadeup .9s ease-out both}
.revealing .ch{animation:ink .95s ease-out both;animation-delay:calc(.35s + var(--i)*45ms)}
.revealing .sign{animation:fadeup 1s ease-out both;animation-delay:var(--d-sign)}
.revealing .seal{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d-seal)}
@keyframes ink{0%{color:rgba(43,37,34,0);text-shadow:0 0 calc(var(--uc)*9) rgba(43,37,34,.55)}100%{color:#2b2522;text-shadow:0 0 0 rgba(43,37,34,0)}}
@keyframes fadeup{0%{opacity:0;transform:translateY(calc(var(--uc)*10))}100%{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:rotate(-3deg) scale(1.8)}100%{opacity:.92;transform:rotate(-3deg) scale(1)}}
.editing [data-field]{outline:1px dashed rgba(31,142,211,.6);outline-offset:calc(var(--uc)*6);border-radius:4px;
  background-color:rgba(31,142,211,.05);cursor:text;user-select:text;-webkit-user-select:text}
.editing [data-field]:focus{outline-style:solid;background-color:rgba(31,142,211,.08)}
.editing .msg-body{min-height:calc(var(--lh)*8)}

/* ---------- 界面 ---------- */
.hint{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));z-index:30;text-align:center;pointer-events:none;
  font-size:13px;letter-spacing:.3em;color:var(--ui-dim);transition:opacity .5s ease}
.hint svg{display:block;margin:0 auto 4px;width:18px;height:18px;opacity:.85;animation:bob 1.6s ease-in-out infinite}
.hint.no-arrow svg{display:none}
@keyframes bob{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
.controls{position:fixed;left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 22px);transform:translateX(-50%);z-index:30;
  display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(14,24,40,.58);border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .4s}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border:0;border-radius:999px;background:transparent;
  color:var(--ui);font-size:14px;letter-spacing:.06em;cursor:pointer;white-space:nowrap;transition:background .2s,transform .15s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid rgba(255,214,170,.8);outline-offset:2px}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:linear-gradient(180deg,#F66A36,#DA4519);color:#fff;box-shadow:0 6px 18px rgba(234,75,30,.42),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{background:linear-gradient(180deg,#FF7843,#E24D20)}
.btn[hidden]{display:none}
.iconbtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:31;width:40px;height:40px;
  border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(14,24,40,.5);color:var(--ui);display:grid;place-items:center;
  cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.iconbtn svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 84px);transform:translate(-50%,10px);z-index:32;
  padding:10px 16px;border-radius:12px;background:rgba(20,30,48,.92);border:1px solid rgba(255,255,255,.12);font-size:13px;line-height:1.6;
  color:var(--ui);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;width:max-content;max-width:min(88vw,420px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 署名 */
.credit{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));z-index:30;pointer-events:none;text-align:center;
  font-size:11px;line-height:14px;letter-spacing:.12em;color:rgba(246,231,214,.55);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pillbtn{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:31;display:inline-flex;align-items:center;gap:6px;
  height:40px;padding:0 14px 0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(14,24,40,.5);color:var(--ui);font-size:13px;
  letter-spacing:.08em;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pillbtn svg{width:17px;height:17px}
.pillbtn[hidden]{display:none}
.pillbtn:focus-visible,.iconbtn:focus-visible{outline:2px solid rgba(255,214,170,.8);outline-offset:2px}

/* ---------- 填写信息（选填） ---------- */
dialog.sheet{border:0;padding:0;margin:auto;width:min(92vw,420px);max-width:none;background:transparent;color:var(--ui)}
dialog.sheet::backdrop{background:rgba(4,8,16,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-in{background:rgba(17,27,45,.96);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:.08em}
.sheet .sub{margin:0 0 16px;font-size:13px;line-height:1.6;color:var(--ui-dim)}
.field{display:block;margin-bottom:12px}
.field>span{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--ui-dim)}
.field em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid rgba(246,231,214,.25);color:rgba(246,231,214,.6)}
.field input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:#fff;font:inherit;font-size:16px;outline:none;user-select:text;-webkit-user-select:text;transition:border-color .2s,background .2s}
.field input:focus{border-color:rgba(246,106,54,.85);background:rgba(255,255,255,.09)}
.field input::placeholder{color:rgba(246,231,214,.34)}
.preview{margin:6px 0 16px;padding:10px 12px;border-radius:12px;background:rgba(244,243,239,.94);color:#2b2522;font-family:var(--kai);
  font-size:15px;line-height:1.75;white-space:pre-wrap}
.preview b{display:block;margin-bottom:2px;font:600 11px/1.4 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.12em;color:#1F8ED3}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.sheet .btn.ghost{border:1px solid rgba(255,255,255,.14)}
@media (max-width:520px){
  dialog.sheet{width:100vw;margin:auto 0 0}
  .sheet-in{border-radius:20px 20px 0 0;padding-bottom:max(18px,env(safe-area-inset-bottom))}
  body.is-open .hint{top:calc(max(16px,env(safe-area-inset-top)) + 44px);letter-spacing:.16em}
}
@media (max-width:430px){.btn{padding:0 12px;font-size:13px;gap:5px}}
@media (max-width:360px){.controls .btn .lbl{display:none}.controls .btn{padding:0 11px}}
@media (prefers-reduced-motion:reduce){.hint svg,.charm .glint,#card .wave i,#card .sheen i{animation:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<canvas id="bgfx" class="fx" aria-hidden="true"></canvas>

<main id="scene">
  <!-- 封套后片 -->
  <div class="layer" id="sleeveBack">
    <div class="panel back-panel" data-drag></div>
  </div>

  <!-- 内卡 -->
  <div id="card" tabindex="0" role="button" aria-label="贺卡内页：按 Enter 抽出或翻面">
    <div class="cshadow" id="shTight"><svg viewBox="-90 -90 740 1136" aria-hidden="true"><defs><filter id="fTight" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter></defs>
      <polygon points="128.2,0 560,0 560,956 0,956 0,128.2" fill="#2a0800" transform="translate(2 5)" filter="url(#fTight)"/></svg></div>
    <div class="cshadow" id="shSoft" style="opacity:0"><svg viewBox="-90 -90 740 1136" aria-hidden="true"><defs><filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter></defs>

<script>
(() => {
'use strict';

/* =====================================================================
 * ① 贺卡文字 —— 在这里修改默认祝福语（\n 表示换行）
 *    祝福语 = 开头（intro，庆祝建校 70 周年）+ 致辞（dedicate，含学院和班级）+ 正文（body）。

 *      · 填了学院或班级 → 致辞使用 dedicate（{学院}{班级} 会被替换），否则使用 dedicateAll。
 *    正文也可以在页面上点「编辑祝福」修改；所有内容会写进网址（#m=…），分享该链接即可。
 * ===================================================================== */
const CONFIG = {
  to:          '亲爱的你',                         // 未填写姓名时的称呼
  toWithName:  '亲爱的{姓名}',                     // 填写姓名后的称呼
  intro:       '值此电子科技大学七十华诞之际，',
  dedicate:    '谨以此卡，致{学院}{班级}的你。',   // 填写了学院或班级时
  dedicateAll: '谨以此卡，致每一位成电人。',       // 两项都没填时
  body: '七十载弦歌不辍，银杏又黄。\n愿你在书页与电路之间，\n找到属于自己的那束光；\n以芯为笔，以心为墨，\n祝你所行皆坦途，所愿皆可期！',
  from: '集成电路科学与工程学院',
  date: '丙午年 · 秋',
  seal: '芯艺',        // 印章上的两个字
  sound: true,         // 是否默认开启音效
};

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const root = document.documentElement;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const DEG = Math.PI / 180;
const r2 = n => Math.round(n * 100) / 100;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const E = {
  inOut: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: t => 1 - Math.pow(1 - t, 4),
  back: t => { const c = 1.35; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};

/* ---------- 几何（封套坐标：宽 690 × 高 1000，与实物照片测量比例一致） ---------- */
const G = {
  C: [345, 500],                          // 封套中心
  card: { x: 104, y: 30, w: 560, h: 956 },// 内卡在封套中的位置
  waveTop: 312, waveAmp: 35,              // 前片波浪口
  hole: [514, 829, 100],                  // 花形镂空（正对院徽）
  ring: [468, 494],                       // 银杏挂环
  charmRest: -54,                         // 挂饰静止角度（与照片一致）
};
// 内卡正面电路走线（相对坐标，由照片版画测得），电子从书页一端流向卡片边缘
const TRACES = [
  [[0.39, 0.248], [0.281, 0.145], [0.277, -0.01]],
  [[0.455, 0.212], [0.379, 0.133], [0.374, -0.01]],
  [[0.55, 0.188], [0.493, 0.126], [0.484, -0.01]],
  [[0.651, 0.158], [0.646, -0.01]],
  [[0.726, 0.158], [0.710, -0.01]],
  [[0.791, 0.158], [0.783, -0.01]],
  [[0.883, 0.155], [0.877, 0.044]],        // 终点是圆形焊盘 → 指示灯
  [[0.28, 0.288], [0.19, 0.222], [0.175, 0.215], [-0.01, 0.214]],
];

/* ---------- 路径生成 ---------- */
function wavePts() {
  const pts = [];
  for (let x = 0; x <= 690; x += 6) pts.push([x, G.waveTop + G.waveAmp * (1 - Math.cos(4 * Math.PI * x / 690)) / 2]);
  pts.push([690, G.waveTop]);
  return pts;
}
const waveD = () => 'M' + wavePts().map(p => r2(p[0]) + ' ' + r2(p[1])).join('L');
function flowerD(cx, cy, R) {
  const d = .55 * R, rl = .45 * R;
  const t = d * Math.cos(30 * DEG) + Math.sqrt(rl * rl - Math.pow(d * Math.sin(30 * DEG), 2));
  let s = '';
  for (let i = 0; i <= 6; i++) {
    const a = (-30 + i * 60) * DEG, x = r2(cx + t * Math.cos(a)), y = r2(cy + t * Math.sin(a));
    s += i ? `A${r2(rl)} ${r2(rl)} 0 0 1 ${x} ${y}` : `M${x} ${y}`;
  }
  return s + 'Z';
}
function leafR(a, R, o) {
  const n = Math.exp(-Math.pow(a / (o.nw || 5.5), 2));
  const s = .5 + .5 * Math.cos(2 * Math.PI * a / (o.per || 21));
  const fall = Math.pow(Math.abs(a) / o.spread, 5) * .14;
  return R * (1 - (o.notch ?? .15) * n - (o.scal ?? .045) * s - fall);
}
// 银杏叶：叶柄基点在 (cx,cy)，扇面朝 +y 方向展开
function ginkgoD(R, o = {}) {
  o = Object.assign({ spread: 62, cx: 0, cy: 0 }, o);
  const N = 84, pts = [];
  for (let i = 0; i <= N; i++) {
    const a = -o.spread + 2 * o.spread * i / N, r = leafR(a, R, o);
    pts.push([o.cx + r * Math.sin(a * DEG), o.cy + r * Math.cos(a * DEG)]);
  }
  const p0 = pts[0], pN = pts[N], q = (p, k1, k2) => `${r2(o.cx + (p[0] - o.cx) * k1)} ${r2(o.cy + (p[1] - o.cy) * k2)}`;
  let d = `M${r2(o.cx)} ${r2(o.cy)}Q${q(p0, .42, .64)} ${r2(p0[0])} ${r2(p0[1])}`;
  for (let i = 1; i <= N; i++) d += `L${r2(pts[i][0])} ${r2(pts[i][1])}`;
  return d + `Q${q(pN, .42, .64)} ${r2(o.cx)} ${r2(o.cy)}Z`;
}
function ridgesD(R, o, offset) {
  let d = '';
  for (let a = -57; a <= 57.1; a += 3.4) {
    const b = (a + offset) * DEG, r1 = leafR(a + offset, R, o) - 6;
    d += `M${r2(o.cx + 11 * Math.sin(b))} ${r2(o.cy + 11 * Math.cos(b))}L${r2(o.cx + r1 * Math.sin(b))} ${r2(o.cy + r1 * Math.cos(b))}`;
  }
  return d;
}

/* ---------- 纹理（珠光纸颗粒） ---------- */
function noiseTile(size, px) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d'), im = g.createImageData(size, size), d = im.data;
  for (let i = 0; i < size * size; i++) { const p = px(); d[i * 4] = p[0]; d[i * 4 + 1] = p[1]; d[i * 4 + 2] = p[2]; d[i * 4 + 3] = p[3]; }
  g.putImageData(im, 0, 0);

/* ---------- 音效（WebAudio 合成，无需外部文件） ---------- */
const Snd = {

const b64e = s => { let bin = ''; new TextEncoder().encode(s).forEach(b => (bin += String.fromCharCode(b))); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

/* ---------- 填写信息（姓名 / 学院 / 班级，均为选填） ---------- */

/* ---------- 编排：抽出 / 收回 / 翻面 ---------- */
async function openCard() {
  if (phase !== 'closed' || busy) return;
  busy = true; phase = 'opening'; updateUI();
  Snd.slide();
  framed = true;
  const left = clamp(1 - S.pull / 1000, 0, 1);
  await tween(S, { pull: 1000 }, 380 + 900 * left, E.inOut);

  const top = attachedPose(S, S.pull);

  Snd.chime();
  const t = openPose();
  tween(S, { lift: 1 }, 700, E.out);
  await Promise.all([tween(S, t.sleeve, 1150, E.out), tween(C, t.card, 1150, E.back)]);

  tween(S, { lift: 0 }, 900, E.inOut);
  await Promise.all([tween(S, sp, 950, E.inOut), tween(C, cp, 950, E.inOut)]);

/* ---------- 交互：拖动抽卡、点击、键盘 ---------- */
